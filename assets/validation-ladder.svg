<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Validation ladder and current status</title>
  <rect width="860" height="300" rx="12" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Validation ladder (status: November 2026)</text>

  <!-- steps, rising -->
  <g font-size="13">
    <rect x="30" y="196" width="190" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="125" y="222" text-anchor="middle" font-weight="600" fill="#14532d">Bench</text>
    <text x="125" y="242" text-anchor="middle" fill="#14532d">done: end-to-end check</text>

    <rect x="232" y="152" width="190" height="64" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="327" y="178" text-anchor="middle" font-weight="600" fill="#374151">Healthy volunteers</text>
    <text x="327" y="198" text-anchor="middle" fill="#374151">next step</text>

    <rect x="434" y="108" width="190" height="64" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="529" y="134" text-anchor="middle" font-weight="600" fill="#374151">Clinician review</text>
    <text x="529" y="154" text-anchor="middle" fill="#374151">not done</text>

    <rect x="636" y="64" width="194" height="64" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="733" y="90" text-anchor="middle" font-weight="600" fill="#374151">Supervised patient pilot</text>
    <text x="733" y="110" text-anchor="middle" fill="#374151">not done</text>
  </g>

  <!-- simulator track -->
  <rect x="30" y="64" width="380" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="220" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Parallel track: seeded simulator</text>
  <text x="220" y="110" text-anchor="middle" font-size="13" fill="#1e3a8a">credibility L0 reached (verified code, not realism)</text>

  <text x="430" y="284" text-anchor="middle" font-size="12" fill="#6b7280">Green = done. Grey = not done. No patient data exists. Simulation cannot establish patient safety.</text>
</svg>
